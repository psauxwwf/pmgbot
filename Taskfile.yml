---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv: ["build.env"]

vars:
  gobin: go
  ldflags: "-extldflags '-static' -w -s -buildid="
  gcflags: "all=-trimpath={{.PWD}} -dwarf=false -l"
  asmflags: "all=-trimpath={{.PWD}}"
  bin: "{{.PWD}}/bin"
  app: "pmgbot"
  app_bin: "{{.bin}}/{{.app}}"
  repo_name:
    sh: basename "{{.PWD}}"

env:
  COMPOSE_BAKE: true
  CGO_ENABLED: 0
  GOARCH: amd64
  GOOS: linux

tasks:
  setup:
    desc: set up the environment
    internal: true
    silent: true
    cmds:
      - mkdir -p "{{.bin}}"

  build:
    desc: common build
    deps:
      - setup
    cmds:
      - >
        {{.gobin}} build
        -tags netgo
        -ldflags="{{.ldflags}}"
        -trimpath
        -gcflags="{{.gcflags}}"
        -asmflags="{{.asmflags}}"
        -o "{{.app_bin}}"
        ./cmd/{{.app}}
      - strip "{{.app_bin}}"
      - objcopy --strip-unneeded "{{.app_bin}}"

  test:
    desc: run test
    cmds:
      - go fix ./...
      - go test ./...

  test:analyze-smoke:
    desc: run analyze command with spam.json
    silent: true
    preconditions:
      - test -f spam.json
    cmds:
      - |
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT
        cat > "$tmpdir/pmgsh" <<'EOF'
        #!/bin/sh
        if [ "$1" = "get" ] && [ "$2" = "/quarantine/spam" ]; then
          cat "${PMG_SPAM_JSON:?}"
          exit 0
        fi

        echo "unexpected pmgsh args: $*" >&2
        exit 1
        EOF
        chmod +x "$tmpdir/pmgsh"
        cat > "$tmpdir/pmgbot.yaml" <<'EOF'
        log_level: info
        sudo: false
        daemon:
          every: 10m
          timeout: 1m
        rules: []
        EOF
        PMG_SPAM_JSON="{{.PWD}}/spam.json" PATH="$tmpdir:$PATH" go run ./cmd/pmgbot analyze --config "$tmpdir/pmgbot.yaml"
